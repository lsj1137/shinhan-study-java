<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSP/Servlet 학습 메뉴</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 기본 스타일 및 배경 */
        body {
            background-color: #f7f9fb; /* 연한 배경색 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-top: 50px;
        }
        
        /* 컨테이너 및 헤더 */
        #main-container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .main-header {
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 40px;
            text-align: center;
        }
        .sub-header {
            font-weight: 600;
            color: #464646;
            margin-bottom: 25px;
            border-bottom: 1px solid #e1e5e8;
            padding-bottom: 10px;
        }

        /* 메뉴 카드 스타일 */
        .menu-card {
            display: block;
            background-color: #ffffff;
            border-radius: 12px; /* 둥근 모서리 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* 은은한 그림자 */
            padding: 20px;
            text-decoration: none; /* 링크 밑줄 제거 */
            color: #1a1a1a;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%; /* 그리드 내에서 높이 통일 */
        }
        .menu-card:hover {
            transform: translateY(-3px); /* 마우스 오버 시 살짝 떠오르는 효과 */
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            color: #1a1a1a; /* 호버 시 글씨색 유지 */
        }
        
        .card-icon {
            font-size: 2rem;
            color: #0066ff; /* 토스 블루 */
            margin-bottom: 10px;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .card-description {
            font-size: 0.9rem;
            color: #7a7a7a;
        }

        /* 폼 버튼 스타일 */
        .form-send-btn {
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 0.9rem;
            margin-right: 8px;
            transition: background-color 0.2s;
        }
        .form-send-btn:hover {
            background-color: #005ce6;
        }
        
        /* 폼 리스트 스타일 조정 */
        .form-list-item {
            list-style: none;
            padding: 15px 20px;
            background-color: #f0f3f5;
            border-radius: 8px;
            margin-bottom: 15px;
            height:100%;
        }
        .form-list-item form {
            display: inline-block;
            margin-right: 15px;
        }
    </style>
</head>
<body>
<div id="main-container" class="container">

    <h1 class="main-header">JSP/Servlet 학습 메뉴 (세준)</h1>

    <div class="row g-4">
        
        <h2 class="sub-header">기본 기능 및 테스트</h2>
        
        <div class="col-md-4 col-sm-6">
            <a href="first" class="menu-card">
                <div class="card-icon"><i class="fas fa-file-code"></i></div>
                <div class="card-title">First 페이지 이동</div>
                <div class="card-description">기본 Servlet 연결 테스트 페이지로 이동합니다.</div>
            </a>
        </div>

        <div class="col-md-8">
            <div class="form-list-item">
                <div class="card-title">Get 요청과 Post 요청 테스트</div>
                <div class="card-description mb-3">다른 요청 방식을 사용하여 서버에 데이터를 전송합니다.</div>
                
                <form action="first" method="get" class="d-inline">
                    <button type="submit" class="form-send-btn">GET 전송 (Button)</button>
                    <input type="submit" value="GET 전송 (Input)" class="form-send-btn">
                </form>
                
                <form action="first" method="post" class="d-inline">
                    <button type="submit" class="form-send-btn">POST 전송 (Button)</button>
                    <input type="submit" value="POST 전송 (Input)" class="form-send-btn">
                </form>
            </div>
        </div>
        
    </div>

    <div class="row mt-4 g-4">
        <h2 class="sub-header">애플리케이션 모듈</h2>

        <div class="col-md-4 col-sm-6">
            <a href="auth/login.do" class="menu-card">
                <div class="card-icon"><i class="fas fa-sign-in-alt"></i></div>
                <div class="card-title">로그인</div>
                <div class="card-description">사용자 인증 페이지로 이동합니다.</div>
            </a>
        </div>

        <div class="col-md-4 col-sm-6">
            <a href="emp/list.do" class="menu-card">
                <div class="card-icon"><i class="fas fa-users"></i></div>
                <div class="card-title">직원 목록 보기</div>
                <div class="card-description">전체 직원 데이터를 조회하는 페이지입니다.</div>
            </a>
        </div>

        <div class="col-md-4 col-sm-6">
            <a href="dept/list.do" class="menu-card">
                <div class="card-icon"><i class="fas fa-building"></i></div>
                <div class="card-title">부서 목록 보기</div>
                <div class="card-description">부서 데이터 CRUD 모듈로 이동합니다.</div>
            </a>
        </div>
        <div class="col-md-4 col-sm-6">
            <a href="emp/joblist.do" class="menu-card">
            	<div class="card-icon"><i class="fas fa-briefcase"></i></div>
            	<div class="card-title">직책 목록</div>
                <div class="card-description">직책 정보 (Job Data)를 조회합니다.</div>
            </a>
        </div>
        
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
